# MCP-Ectors Configuration File

# Application settings
name = "mcp-ectors"
environment = "development" # development, production, testing

[logging]
level = "info"              # trace, debug, info, warn, error
timestamps = true
file = "logs/mcp-ectors.log"
stdout = true
format = "plain"            # plain, json

[transport]
bind_address = "127.0.0.1"
port = 8080
# Comment out TLS settings if not using HTTPS
# tls_cert = "certs/server.crt"
# tls_key = "certs/server.key"
timeout_secs = 30
max_request_size = 10485760 # 10 MB
keep_alive_secs = 75

[router]
wasm_dir = "wasm"
watch_wasm_dir = true
wasm_memory_limit_mb = 256
max_instances = 10
preload_routers = true

[security]
auth_enabled = false
# JWT secret must be at least 32 characters long
# jwt_secret = "this_is_a_very_long_and_secure_jwt_secret_key"
# API keys in format: "key" = "role"
# api_keys = { "api_key_1" = "admin", "api_key_2" = "user" }
allowed_origins = ["*"]
enforce_https = false

# Any custom settings can be added here
[custom]
setting1 = "value1"
setting2 = 123
